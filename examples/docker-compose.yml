services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -p 1883 -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null 2>&1"]
      interval: 5s
      timeout: 4s
      retries: 5

  samsung-tv-art:
    image: ghcr.io/quangthuandinh/samsung-tv-art-uploader:latest
    container_name: samsung-tv-art
    restart: unless-stopped
    env_file:
      - ./samsung-tv-art.env
    environment:
      SAMSUNG_TV_ART_MQTT_HOST: mosquitto
      SAMSUNG_TV_ART_MQTT_PORT: "1883"
      SAMSUNG_TV_ART_MQTT_USERNAME: ""
      SAMSUNG_TV_ART_MQTT_PASSWORD: ""
      SAMSUNG_TV_ART_MQTT_WS_PORT: "9001"
    depends_on:
      mosquitto:
        condition: service_healthy
    volumes:
      - ./data:/data
      - ./media:/app/frame_tv_art_collections
    ports:
      - "8080:8080"

volumes:
  mosquitto-data:
