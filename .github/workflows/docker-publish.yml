name: Build and push Docker image

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to publish
        required: true
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag name
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: echo "TAG=${RELEASE_TAG}" >> $GITHUB_OUTPUT

      - name: Check if stable release (no pre-release suffix)
        id: release_type
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          TAG="${RELEASE_TAG}"
          if echo "$TAG" | grep -qE '\-(alpha|beta|rc)'; then
            echo "IS_STABLE=false" >> $GITHUB_OUTPUT
          else
            echo "IS_STABLE=true" >> $GITHUB_OUTPUT
          fi

      - name: Build and push (pre-release — versioned tag only)
        if: steps.release_type.outputs.IS_STABLE == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/quangthuandinh/samsung-tv-art-uploader:${{ steps.tag.outputs.TAG }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push (stable — versioned tag + latest)
        if: steps.release_type.outputs.IS_STABLE == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/quangthuandinh/samsung-tv-art-uploader:${{ steps.tag.outputs.TAG }}
            ghcr.io/quangthuandinh/samsung-tv-art-uploader:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
